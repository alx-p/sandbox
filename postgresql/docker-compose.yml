services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: pg-server
    environment:
      POSTGRES_DB: ${DB_NAME} #pg_db
      POSTGRES_USER: ${DB_USER} #postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD} #postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pg_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./dumps:/var/lib/postgresql/dumps
    networks:
      - sandbox-network

  app:
    build: .
    container_name: source-data-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME} #pg_db
      DB_USER: ${DB_USER} #postgres
      DB_PASSWORD: ${DB_PASSWORD} #postgres
      INTERVAL: 1  # Интервал запуска скрипта (в секундах)
    ports:
      - "5002:5000"
    networks:
      - sandbox-network

networks:
  sandbox-network:
    #external: true # Внешняя сеть. sudo docker network create sandbox-network
    driver: bridge

volumes:
  data:
  dumps: